# Codemagic CI/CD yapılandırması
# Her iki platform için build alır (iOS + Android)
#
# Kullanım:
#   1. Kod GitHub'a yüklenir
#   2. Codemagic bu dosyayı okuyup otomatik build alır
#   3. iOS: TestFlight'a yükler (App Store Connect API Key gerekli)
#   4. Android: AAB üretir
#
# Ortam değişkenleri (Codemagic UI'dan eklenir):
#   - .env içeriği
#   - GOOGLE_SERVICE_INFO_PLIST (iOS Firebase)
#   - GOOGLE_SERVICES_JSON (Android Firebase)

workflows:
  # ---------------------------------------------------------------
  # iOS — TestFlight'a yükle
  # ---------------------------------------------------------------
  ios-release:
    name: iOS Release (TestFlight)
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      # Codemagic UI'da oluşturulan App Store Connect entegrasyonu
      app_store_connect: Codemagic ASC

    environment:
      # Codemagic'te "fitcheck" adlı değişken grubuna eklenen secret'lar
      # (ENV_FILE vb.) buradan okunur.
      groups:
        - fitcheck
      # Yüklenen sertifika ve profili build makinesine kurar.
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.fitcheck2.app
      flutter: stable
      xcode: latest
      cocoapods: default
      vars:
        # .env içeriğini Codemagic UI'da "BG_REMOVE_API_KEY" gibi ekleyin
        # veya burada tanımlayın (gizli tutmak için UI tercih edilir)
        FLUTTER_BUILD_MODE: release

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
      cancel_previous_builds: true

    scripts:
      - name: Flutter bağımlılıkları
        script: |
          flutter pub get

      # .env dosyasını Codemagic ortam değişkeninden oluştur.
      # Boşsa build'i durdur: anahtarlar olmadan AI özellikleri çalışmaz.
      - name: .env dosyası oluştur
        script: |
          if [ -z "${ENV_FILE:-}" ]; then
            echo "HATA: ENV_FILE tanımlı değil. Codemagic > Environment variables bölümüne ekleyin."
            exit 1
          fi
          printf '%s\n' "$ENV_FILE" > .env

      # iOS Firebase yapılandırması depoda zaten var; yalnızca secret
      # verilmişse üzerine yaz. Boş secret dosyayı bozmasın.
      - name: GoogleService-Info.plist yerleştir
        script: |
          if [ -n "${GOOGLE_SERVICE_INFO_PLIST:-}" ]; then
            echo "$GOOGLE_SERVICE_INFO_PLIST" | base64 --decode > ios/Runner/GoogleService-Info.plist
          else
            echo "GOOGLE_SERVICE_INFO_PLIST tanımlı değil; depodaki dosya kullanılacak."
          fi

      # TestFlight aynı build numarasını ikinci kez kabul etmez.
      # pubspec'teki numaranın üzerine Codemagic build sayacını ekle.
      - name: Build numarası hesapla
        script: |
          BASE=$(sed -n 's/^version:.*+//p' pubspec.yaml | tr -d '[:space:]')
          BASE=${BASE:-0}
          EFFECTIVE=$((BASE + BUILD_NUMBER))
          echo "BUILD_NUMBER_EFFECTIVE=$EFFECTIVE" >> $CM_ENV
          echo "CFBundleVersion: $EFFECTIVE"

      - name: Testler
        script: |
          flutter test --reporter compact

      - name: CocoaPods kur
        script: |
          cd ios && pod install

      # Sertifika ve profil Codemagic'e elle yüklenir (Code signing identities).
      # Otomatik fetch/profil eşleştirme kullanılmıyor.
      - name: iOS imzalamayı ayarla
        script: |
          xcode-project use-profiles

      - name: İmza teşhisi
        script: |
          echo "=== Kurulu profiller ==="
          for f in "$HOME/Library/MobileDevice/Provisioning Profiles"/*.mobileprovision; do
            [ -e "$f" ] || continue
            echo "-- $f"
            security cms -D -i "$f" 2>/dev/null | plutil -extract Name raw - 2>/dev/null || true
            security cms -D -i "$f" 2>/dev/null | plutil -extract UUID raw - 2>/dev/null || true
            security cms -D -i "$f" 2>/dev/null | plutil -extract Entitlements.aps-environment raw - 2>/dev/null || true
            security cms -D -i "$f" 2>/dev/null | plutil -extract Entitlements.com.apple.developer.applesignin xml1 -o - 2>/dev/null || true
          done
          echo "=== Kod imzalama kimlikleri ==="
          security find-identity -v -p codesigning || true
          echo "=== Proje imza ayarları ==="
          grep -E "CODE_SIGN_STYLE|PROVISIONING_PROFILE_SPECIFIER|CODE_SIGN_IDENTITY|DEVELOPMENT_TEAM" ios/Runner.xcodeproj/project.pbxproj || true

      - name: IPA dışa aktarım profilini sabitle
        script: |
          cat > ios/ExportOptions.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>destination</key>
            <string>export</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>teamID</key>
            <string>M2KMC8X2N9</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.fitcheck2.app</key>
              <string>ayberk ozcan</string>
            </dict>
          </dict>
          </plist>
          PLIST
          plutil -lint ios/ExportOptions.plist

      - name: iOS build (IPA)
        script: |
          flutter build ipa --release \
            --build-number=$BUILD_NUMBER_EFFECTIVE \
            --export-options-plist=ios/ExportOptions.plist \
            --obfuscate \
            --split-debug-info=build/symbols-ios

      - name: IPA çıktısını doğrula
        script: |
          shopt -s nullglob
          ipas=(build/ios/ipa/*.ipa)
          if [ ${#ipas[@]} -eq 0 ]; then
            echo "HATA: Xcode arşivi oluşturdu ancak IPA export edilmedi."
            find build/ios -maxdepth 4 -type f -print | head -100
            exit 1
          fi
          echo "IPA hazır: ${ipas[0]}"

    artifacts:
      - build/ios/ipa/*.ipa
      - build/symbols-ios/*.symbols
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        # TestFlight'a yükle
        submit_to_testflight: true

  # ---------------------------------------------------------------
  # Android — AAB üret
  # ---------------------------------------------------------------
  android-release:
    name: Android Release (AAB)
    max_build_duration: 60
    instance_type: linux_x2

    environment:
      groups:
        - fitcheck
      flutter: stable
      vars:
        FLUTTER_BUILD_MODE: release

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
      cancel_previous_builds: true

    scripts:
      - name: Flutter bağımlılıkları
        script: |
          flutter pub get

      - name: .env dosyası oluştur
        script: |
          if [ -z "${ENV_FILE:-}" ]; then
            echo "HATA: ENV_FILE tanımlı değil. Codemagic > Environment variables bölümüne ekleyin."
            exit 1
          fi
          printf '%s\n' "$ENV_FILE" > .env

      # Android Firebase yapılandırması depoda zaten var; yalnızca secret
      # verilmişse üzerine yaz.
      - name: google-services.json yerleştir
        script: |
          if [ -n "${GOOGLE_SERVICES_JSON:-}" ]; then
            echo "$GOOGLE_SERVICES_JSON" | base64 --decode > android/app/google-services.json
          else
            echo "GOOGLE_SERVICES_JSON tanımlı değil; depodaki dosya kullanılacak."
          fi

      # Play aynı versionCode'u kabul etmez.
      - name: Build numarası hesapla
        script: |
          BASE=$(sed -n 's/^version:.*+//p' pubspec.yaml | tr -d '[:space:]')
          BASE=${BASE:-0}
          EFFECTIVE=$((BASE + BUILD_NUMBER))
          echo "BUILD_NUMBER_EFFECTIVE=$EFFECTIVE" >> $CM_ENV
          echo "versionCode: $EFFECTIVE"

      # İmzalama anahtarı (keystore)
      - name: Keystore hazırla
        script: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          echo "storePassword=$KEYSTORE_PASSWORD" > android/key.properties
          echo "keyPassword=$KEY_PASSWORD" >> android/key.properties
          echo "keyAlias=$KEY_ALIAS" >> android/key.properties
          echo "storeFile=upload-keystore.jks" >> android/key.properties

      - name: Android AAB build
        script: |
          flutter build appbundle --release \
            --build-number=$BUILD_NUMBER_EFFECTIVE \
            --obfuscate \
            --split-debug-info=build/symbols

    artifacts:
      - build/app/outputs/bundle/release/*.aab
      - build/symbols/*.symbols
