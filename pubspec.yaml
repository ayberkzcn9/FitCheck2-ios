name: fitcheck
description: "FitCheck - Akıllı Kişisel Stilist ve Gardırop Uygulaması"
publish_to: 'none'

version: 1.0.49+55

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Çoklu dil desteği (i18n) için gerekli paketler
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

  http: ^1.2.0
  image_picker: ^1.0.7
  url_launcher: ^6.3.0
  geolocator: ^14.0.3
  shared_preferences: ^2.5.5
  speech_to_text: ^7.0.0
  flutter_tts: ^4.0.2
  permission_handler: ^11.3.1
  wakelock_plus: ^1.2.8 # 👈 Ekranın açık kalmasını sağlar
  lottie: ^3.5.1
  confetti: ^0.8.0
  flutter_local_notifications: ^22.3.0
  timezone: ^0.11.1
  sensors_plus: ^7.1.0
  tutorial_coach_mark: ^1.3.3
  firebase_core: ^3.0.0
  cloud_firestore: ^5.0.0
  firebase_auth: ^5.0.0
  google_mobile_ads: ^9.1.0
  in_app_purchase: ^3.3.0
  in_app_review: ^2.0.10
  google_sign_in: ^6.2.1
  flutter_markdown: ^0.7.6
  path_provider: ^2.1.5
  firebase_analytics: ^11.6.0
  package_info_plus: ^10.2.1
  flutter_dotenv: ^5.2.1
  firebase_messaging: ^15.0.0
  vibration: ^3.2.1
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  app_tracking_transparency: ^2.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

# 💥 Launcher Icons yapılandırması en dış hizada olmalıdır
flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/images/logo.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true

  # Dil (ARB) dosyalarından otomatik Flutter kodlarının üretilmesi için:
  generate: true

  # 💥 Eğer logosu assets klasöründeyse Flutter'a tanıtmak için bu bölüm önemlidir:
  assets:
    - assets/images/logo.png
    - assets/images/google_logo.png
    - .env